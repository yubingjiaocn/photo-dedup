# =============================================================================
# Photo Dedup — configuration
# Edit `paths.root` to point at your photo library, then run the pipeline.
# All thresholds are documented in docs/ALGORITHM.md.
# =============================================================================

paths:
  root: "E:/Photos"              # top of the library to scan (YYYY/MM/ layout, on the HDD)
  # DB holds all intermediate results (a few hundred MB for 66k files).
  # Keep it on the SSD system drive for fast random reads in stages 2/3.
  # A relative path lands next to this repo -- put the repo on the SSD (e.g. C:).
  db: "./inventory.sqlite"
  # `move` mode relocates deleted files here. This can grow to 100+ GB if you
  # reclaim 20%+, so it usually must live on the HDD (E:). If your SSD has room
  # you may point it there for speed -- your call (see README "Where to put things").
  trash: "E:/Photos/_trash"
  output_dir: "./output"         # review.html / delete_local.txt / etc. (SSD, small)
  models_dir: "./models"         # downloaded YuNet ONNX + cached weights (SSD, small)

scan:
  # File extensions to inventory (case-insensitive). Motion video embedded in
  # a JPEG stays in that JPEG; separate videos are inventoried but not paired.
  extensions: [".jpg", ".jpeg", ".png", ".mp4", ".mp", ".mov"]
  follow_symlinks: false
  commit_every: 100              # stage0/stage1 commit cadence (crash-safe)
  # Embedded motion-photo detection cost knobs (see docs/ALGORITHM.md):
  embedded_head_bytes: 262144            # header window scanned for XMP motion markers
  embedded_full_scan_max_bytes: 0        # >0: also full-scan files <= N bytes for trailing MP4

features:
  # backend: auto | torch | stub
  #   auto  -> use torch/DINOv2 if importable, else fall back to stub
  #   torch -> real DINOv2 + pyiqa + YuNet (needs the GPU stack)
  #   stub  -> deterministic numpy features (tests / no-GPU dry runs)
  backend: "auto"
  device: "cuda"                 # cuda | cpu  (torch backend only)
  # Full-resolution frames are retained for IQA/face analysis. These guards
  # prevent 50 MP photos from turning a nominal batch into multi-GB RAM use.
  batch_size: 4
  max_inflight_megapixels: 80
  # Stills above this inventory-header pixel count are recorded as
  # skipped_oversize before any full decode or GPU/model inference.
  max_process_megapixels: 64
  # Symmetric max(width/height, height/width); strictly greater panoramas skip.
  max_process_aspect_ratio: 3.0
  # IQA/sharpness input keeps aspect ratio and is bounded to this long edge.
  iqa_max_long_edge: 1920
  # SSD thumbnail cache. Stage 1 writes one small JPEG per still image from the
  # decode it already performs for embeddings/IQA/faces -- no second read of the
  # HDD and no second decode. The review UI serves only these files, so paging
  # 100k+ photos never wakes the mechanical disk.
  thumbnails:
    enabled: true
    max_px: 320                 # long edge; ~25-45 KiB per photo in practice
    jpeg_quality: 80
  # Stage 1 phase telemetry: cumulative seconds per phase (HDD read, decode,
  # embedding, IQA, faces, thumbnail, DB) written to the log and performance.txt.
  # Cost is one perf_counter pair per phase per batch -- no per-op CUDA syncs.
  telemetry:
    enabled: true
    gpu_event_every: 16        # also time GPU phases with CUDA events every Nth batch (0 = off)
  dinov2_model: "facebook/dinov2-base"
  dinov2_input: 224
  iqa_musiq: true
  iqa_clipiqa: true
  yunet_input_width: 640         # long-edge resize before face detection
  yunet_score_threshold: 0.6
  exposure_long_edge: 512       # raw exposure metrics; changing this requires Stage 1 + recalibration
  eye_detection:
    enabled: false              # opt-in metadata-only shadow mode
    mode: "shadow"              # never affects Stage 2 or AUTO_REMOVE
    model_path: "face_landmarker.task"  # local under models_dir; no auto-download
    model_sha256: "64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff"
    max_faces: 10
  scene_routing:
    enabled: false              # opt-in local-only SigLIP shadow provider
    mode: "shadow"              # only supported mode; never affects decisions
    # All identity fields are mandatory when enabled. Relative paths resolve
    # beside this config file. URLs/model IDs and implicit downloads are rejected.
    model:
      path: "./models/siglip-base-patch16-224"
      revision: "REPLACE_WITH_EXPLICIT_LOCAL_REVISION"
      sha256: "REPLACE_WITH_64_HEX_DIRECTORY_HASH"
    prompt:
      path: "./research/siglip_prompt_bank_v1.yaml"
      sha256: "REPLACE_WITH_64_HEX_FILE_HASH"
    runtime:
      device: "cuda"            # cuda | cpu; RTX 5070 Ti target
      precision: "float16"      # CUDA: float16/bfloat16/float32; CPU: float32
      batch_size: 16             # prompt chunk size; OOM fails closed, no fallback
  yunet_url: "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"

cluster:
  burst_window_seconds: 30       # Layer-2 sliding time window
  dinov2_threshold: 0.92         # cosine >= this => same burst (higher = stricter)
  phash_hamming_threshold: 2     # Layer-1 exact-dup: hamming <= this
  face_pose_shift_ratio: 0.30    # face-center move > 30% of img width => split group
  min_face_score: 0.6            # ignore YuNet faces below this confidence
  enable_loose_similar: false    # Layer-3 (slow, easy to over-merge). Off by default.
  loose_window_seconds: 300
  loose_dinov2_threshold: 0.96

quality:
  weight_iqa: 0.6
  weight_face: 0.3
  weight_resolution: 0.1
  resolution_ref_mp: 12.0        # megapixels that map to full resolution_bonus=1.0

decision:
  # conservative | balanced | aggressive: margin abstention 0.14/0.08/0.04.
  # Exposure alone never auto-removes; only SHA-256 byte identity does.
  profile: "balanced"

execute:
  mode: "move"                   # automatic decisions are always recoverable
  dry_run: true                  # first run: true (writes plan, touches nothing)
